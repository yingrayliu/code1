<script>/* Original geometric engravings for the Star Veil tarot deck. */
(() => {
  'use strict';
  const gold = '#ddba7c', pale = '#f4d7a1', plum = '#50384f', rose = '#bd8391', lilac = '#ae9cbb', ink = '#241b2b';
  const major = ['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];
  const roman = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
  const suits = ['Wands','Cups','Swords','Pentacles'];
  const ranks = ['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
  const palettes = [
    ['#2b2131','#513047','#805467','#413044'], ['#272032','#47384e','#746079','#352c41'],
    ['#242437','#3b4057','#656c89','#303145'], ['#2e232a','#554044','#826367','#47313b'],
    ['#27262d','#414549','#617475','#363941'], ['#30212e','#533342','#8b535f','#44303c']
  ];
  const p = (d,fill='none',stroke=gold,w=1) => '<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';
  const c = (x,y,r,fill='none',stroke=gold,w=1) => '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'"/>';
  const e = (x,y,rx,ry,fill='none',stroke=gold,w=1) => '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'"/>';
  const g = (transform,body) => '<g transform="'+transform+'">'+body+'</g>';
  const opacity=(n,body)=>'<g opacity="'+n+'">'+body+'</g>';
  const at = (x,y,s,body,rot=0) => g('translate('+x+' '+y+') rotate('+rot+') scale('+s+')',body);
  const mirror = body => body+g('scale(-1 1)',body);
  const repeat = (n,fn) => Array.from({length:n},(_,i)=>fn(i)).join('');
  const pt = (x,y,r,t) => [(x+r*Math.cos(t)).toFixed(2),(y+r*Math.sin(t)).toFixed(2)].join(' ');
  function star(x,y,r,n=4,inner=.28,fill=pale,stroke='none') {
    return p(repeat(n*2,i=>(i?'L':'M')+pt(x,y,(i%2?inner:1)*r,i*Math.PI/n-Math.PI/2))+'Z',fill,stroke,.75);
  }
  const ellipseRays = (x,y,r1,r2,n,col=gold)=>repeat(n,i=>p('M'+pt(x,y,r1,Math.PI*2*i/n)+'L'+pt(x,y,r2-(i%2?1.9:0),Math.PI*2*i/n),'none',col,.65));
  const moon=(x,y,r)=>at(x,y,r/16,p('M6 -15 C-1 -13 -6 -7 -6 0 C-6 8 0 13 7 15 C-4 19 -16 12 -16 0 C-16 -12 -5 -18 6 -15Z',gold,pale,.8)+p('M-8 -8Q-15 1 -7 10 M-3 -13Q-12 -11 -13 -4','none','#8c6951',.8));
  const leaf = (x,y,size,rot=0,color=rose) => at(x,y,size,p('M0 0Q-5 -8 0 -15Q5 -7 0 0Z',color,gold,.7)+p('M0 -1L0 -11','none',gold,.6),rot);
  const sprig = (x,y,size,rot=0) => at(x,y,size,p('M0 0Q-5 -17 1 -32','none',gold,1)+repeat(4,i=>leaf(-1,-4-i*6,.5,i%2?42:-53)),rot);
  const flourish = p('M0 6Q9 5 10 -3Q10 -7 6 -6Q3 -4 5 -2Q6 -1 7 -3 M4 10Q12 10 16 5 M0 1L2 1','none',gold,.85);
  function frame(bg,fill = bg) {
    const corner=flourish+star(3,3,2,4);
    return '<rect x="1" y="1" width="158" height="238" rx="9" fill="'+bg+'" stroke="'+gold+'" stroke-width="1.4"/>'+
      '<rect x="5" y="5" width="150" height="230" rx="6" fill="'+fill+'" stroke="'+gold+'" stroke-opacity=".82" stroke-width=".75"/>'+
      '<rect x="9" y="9" width="142" height="222" rx="5" fill="none" stroke="'+gold+'" stroke-opacity=".55" stroke-width=".55"/>'+
      at(13,14,1,corner)+g('translate(147 14) scale(-1 1)',corner)+g('translate(13 226) scale(1 -1)',corner)+g('translate(147 226) scale(-1 -1)',corner);
  }
  function text(x,y,size,str,spacing=1.2,color=pale) {
    return '<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="'+color+'" font-family="Georgia,Times New Roman,serif" font-size="'+size+'" letter-spacing="'+spacing+'">'+str+'</text>';
  }
  function seeded(seed) {
    let state=seed*8121+541;
    return ()=> (state=(Math.imul(state,1664525)+1013904223)>>>0)/4294967296;
  }
  function field(i) {
    const random=seeded(i+71);
    return repeat(52,j=>{
      const x=15+random()*130,y=32+random()*165,r=.32+random()*1.45;
      return opacity(.44+random()*.48,j%8===0?star(x,y,r*1.8):c(x,y,r*.52,gold,'none'));
    });
  }
  function ground(i,colors) {
    const [base,dark,mid,near]=colors,rand=seeded(i+184);
    const ridge=(y,amplitude,color,end,smooth=false)=>{
      let d='M14 '+y;
      for(let x=14;x<146;) {let nx=Math.min(146,x+8+Math.round(rand()*10)),ny=(y+(rand()-.5)*amplitude).toFixed(1);d+=(smooth?'Q'+(x+5)+' '+(Number(ny)+2)+' ':'L')+nx+' '+ny;x=nx;}
      return p(d+'L146 '+end+'H14Z',color,'none');
    };
    const scarp=repeat(14,()=>{let x=16+rand()*118,y=177+rand()*14;return p('M'+x+' '+y+'q4 -3 8 -7m-3 4 4 -2','none',gold,.5);});
    return ridge(169,41,mid,203)+ridge(181,24,dark,203)+opacity(.4,scarp)+ridge(193,11,near,203,true)+
      opacity(.55,repeat(10,j=>{let x=15+rand()*107,y=191+j*.87;return p('M'+x+' '+y+'q7 -2 15 0t12 0','none',gold,.45);}));
  }
  function labels(top,bottom,bg) {
    const labelSize=bottom.length>18?7:bottom.length>13?8:9.2;
    return p('M20 205H140 M30 208H130','none',gold,.55)+
      p('M46 20H63 M97 20H114','none',gold,.6)+star(42,20,2)+star(118,20,2)+
      text(80,23,9.5,top,1.6)+text(80,221,labelSize,bottom.toUpperCase(),1.05);
  }
  function sunFace(r=22) {
    const body=ellipseRays(0,0,17,23,24)+c(0,0,15,gold,pale,.9)+c(0,0,13,'none','#ad805e',.7)+
      p('M-10 -2Q-6 -5 -2 -2Q-6 0 -9 -1 M2 -2Q6 -5 10 -2Q6 0 3 -1 M0 -4Q-2 1 -2 3Q0 4 2 3 M-4 7Q0 9 4 6','none','#735047',.85)+
      p('M-6 -7L-3 -8 M3 -8L6 -7 M-11 4L-8 5 M8 5L11 4','none','#ad805e',.65);
    return at(0,0,r/23,body);
  }
  const hand = p('M-13 5Q-4 1 0 -4Q3 -9 6 -10Q9 -11 8 -7L5 -2L14 -5Q19 -8 18 -3Q12 3 7 6Q-2 9 -10 12Z',rose,pale,1.15)+p('M-10 7Q-4 5 1 1 M4 4L13 -2','none',gold,.65);
  const eye = p('M-14 0Q0 -12 14 0Q0 10 -14 0Z',ink,pale,1.2)+c(0,0,4,rose,gold,.8)+c(0,0,1.7,ink,'none');
  function crown() {
    return p('M-19 -7L-13 5H13L19 -7L10 -3L6 -13L0 -5L-7 -13L-11 -2Z',rose,pale,1)+p('M-13 6L-12 10H12L13 6Z',gold,pale,.7)+
      c(-19,-8,1.7,gold,'none')+c(19,-8,1.7,gold,'none')+star(0,-11,3.3)+c(0,1,2.2,ink,gold,.75);
  }
  function wing() {
    return p('M0 0Q-19 -3 -30 -22Q-19 -18 -12 -18L-21 -29Q-6 -26 3 -15L6 -6Z',lilac,gold,1)+
      p('M-24 -20Q-14 -11 0 -7 M-18 -23Q-10 -16 -2 -14 M-15 -15L-17 -13 M-10 -12L-12 -10','none',ink,.85);
  }
  const heart = p('M0 16Q-23 1 -18 -10Q-11 -21 0 -8Q11 -21 18 -10Q23 1 0 16Z',rose,pale,1.35)+p('M-13 -9Q-10 -14 -5 -9','none',pale,1.2);
  function cup() {
    return p('M-12 -10Q-12 3 -3 7L-2 12L-7 15L-7 17H7V15L2 12L3 7Q12 3 12 -10Z',rose,pale,1)+e(0,-10,12,3.2,plum,gold,.85)+
      p('M-12 -7Q-18 -11 -16 -4Q-15 1 -9 2 M12 -7Q18 -11 16 -4Q15 1 9 2 M-7 -5Q-6 2 -2 3 M6 -5Q6 -1 3 2 M-4 15H4','none',gold,.9);
  }
  function sword() {
    return p('M0 -20L4 -12L2 8H-2L-4 -12Z',lilac,pale,.9)+p('M0 -15V7','none',gold,.75)+
      p('M-8 10Q0 6 8 10 M-7 11L-9 9 M7 11L9 9 M0 9V16','none',gold,1.8)+c(0,17.5,2.1,rose,gold,.8);
  }
  function wand() {
    return p('M-2 17Q-1 1 -2 -19L0 -21L2 -19L1 17Z','#856451',pale,1)+p('M0 14L-.3 -13','none',gold,.55)+
      leaf(0,-9,.65,-47,rose)+leaf(1,-14,.57,45,lilac)+leaf(1,0,.4,48,rose)+p('M-3 7H3 M-3 9H2','none',pale,.7);
  }
  function coin() {
    return c(0,0,13.5,'#735448',pale,1.2)+c(0,0,11.4,'none',gold,.65)+
      p(repeat(5,i=>(i?'L':'M')+pt(0,0,9,i*4*Math.PI/5-Math.PI/2))+'Z','none',pale,1)+c(0,0,1.65,gold,'none');
  }
  function roseBud(x,y,s=1) {
    return at(x,y,s,repeat(5,i=>g('rotate('+i*72+')',e(0,-3,3,4.4,rose,gold,.6)))+c(0,0,2.7,plum,gold,.65));
  }
  function chaliceCrest() {
    return at(0,3,1.8,cup())+at(-23,-6,.68,wing(),8)+g('translate(23 -6) scale(-.68 .68) rotate(8)',wing())+star(0,-30,7);
  }
  function majorMotif(i) {
    switch(i) {
      case 0: return at(21,-30,.62,sunFace())+
        p('M-35 43L-12 24L13 25L3 35L-3 44 M-32 39L-10 30L2 30','none',gold,1.1)+
        p('M-11 -7Q-5 -15 3 -10L13 4L8 13L-10 9L-17 13Z',rose,pale,1.3)+
        p('M-8 9L-6 21L-14 27L-18 26L-10 16L-12 12 M3 11L11 17L18 10L21 12L13 24L1 21Z',lilac,gold,1.1)+
        p('M-4 -11L-1 -17L5 -13L5 -8','none',pale,1.8)+c(2,-20,6,rose,pale,1.15)+
        p('M-5 -21Q-1 -29 7 -23L10 -22L1 -19Z',plum,gold,1.1)+
        p('M-4 -24Q-12 -40 -15 -29Q-12 -25 -5 -25 M-18 -8L24 -19 M-8 -1L-15 -6L-23 -2 M5 -6L11 -11L14 -16','none',pale,1.65)+
        p('M20 -18Q36 -13 30 -5Q23 -1 17 -8Q14 -13 20 -18Z',rose,gold,.95)+
        at(-21,0,.8,roseBud(0,0))+sprig(-28,28,.55,-12);
      case 1: return ellipseRays(0,-24,15,19,20)+
        p('M-15 -24C-9 -39 3 -22 8 -22C18 -16 22 -29 14 -30C7 -32 0 -18 -8 -18C-13 -18 -16 -21 -15 -24Z','none',pale,1.7)+
        at(1,-2,1.16,hand,-25)+at(16,-12,.72,wand(),29)+
        p('M-30 29Q-17 13 -8 8L-1 17Q-13 28 -19 37Z',rose,pale,1.35)+p('M-26 29L-17 34 M-23 26L-15 31 M-18 22L-12 26','none',gold,.8)+
        at(-24,12,.55,cup())+at(24,19,.6,sword(),24)+at(7,30,.58,coin());
      case 2: {
        const col=p('M-4 -26H4L3 -22H-3Z M-3 -21H3V28H-3Z M-5 28H5L6 32H-6Z',lilac,gold,.8)+p('M0 -17V24','none',plum,1);
        return at(-24,0,1,col)+at(24,0,1,col)+
          p('M-19 -26Q0 -36 19 -26V21Q10 9 10 -10Q1 -5 0 6Q-3 -6 -10 -10Q-11 13 -19 23Z',plum,gold,1)+
          moon(-11,-20,5)+c(0,-19,3.7,pale,'none')+g('translate(11 -20) scale(-1 1)',moon(0,0,5))+
          at(0,-5,.95,eye)+p('M-10 31Q-4 16 0 10Q6 18 11 32 M-7 32Q0 28 7 32','none',gold,1.1)+
          moon(0,39,7);
      }
      case 3: return ellipseRays(0,-7,27,32,32)+at(0,-8,1.3,crown())+
        mirror(sprig(-20,32,.87,-35))+roseBud(0,20,1.05)+roseBud(-9,28,.62)+roseBud(11,27,.62)+
        mirror(p('M0 37Q-15 35 -25 24','none',pale,1.15))+star(0,-32,4);
      case 4: {
        const horn=p('M-4 -7Q-18 -32 -31 -15Q-40 3 -23 7Q-15 6 -16 0Q-16 -6 -22 -4Q-27 -2 -23 2 M-25 -15Q-19 -18 -13 -10 M-30 -10L-26 -11 M-31 -5L-27 -6','none',gold,2.2);
        return at(0,-16,.92,crown())+mirror(horn)+p('M0 -6Q-8 -13 -17 -4L-12 11L-6 26L0 31L6 26L12 11L17 -4Q8 -13 0 -6Z',rose,pale,1.35)+
          mirror(p('M-12 0L-5 4L-8 7Z M-4 10L-2 20','none',ink,1.25))+p('M-5 22L0 25L5 22 M0 26V29','none',ink,1)+star(0,-1,3.5);
      }
      case 5: {
        const key=c(0,-10,5.1,'none',gold,2)+c(0,-10,2.4,'none',pale,.7)+p('M0 -4V16H6V13H3V10','none',gold,2.4);
        return p('M-16 -10Q-14 -27 0 -39Q14 -27 16 -10L12 -6H-12Z',rose,pale,1.4)+
          p('M0 -34V-10 M-12 -12H12 M-5 -23H5','none',gold,1.1)+
          at(0,10,1.42,key,-44)+at(0,10,1.42,key,44)+c(0,12,3.2,plum,pale,1)+
          mirror(sprig(-25,28,.52,-12));
      }
      case 6: {
        const swan=p('M-1 26C-21 35 -37 24 -34 10Q-27 18 -24 10C-27 -4 -19 -25 -10 -21Q-4 -20 -5 -14Q-7 -11 -11 -13Q-17 -17 -18 -5Q-17 5 -9 9Q-2 12 -1 26Z',lilac,pale,1.15)+
          p('M-8 -17L-2 -15L-7 -14 M-29 18Q-18 26 -8 20 M-24 15Q-17 20 -12 17','none',gold,1.1)+c(-9,-17.5,.9,ink,'none');
        return at(0,-25,.72,heart)+mirror(swan)+roseBud(0,31,.8);
      }
      case 7: return p('M-25 -25H25L21 -18H-21Z',rose,pale,1.25)+
        p('M-23 -25Q0 -32 23 -25 M-20 -18L-18 10 M20 -18L18 10','none',gold,1.55)+
        p('M-24 8Q-1 14 24 7L19 24H-17Z',rose,pale,1.3)+
        at(0,16,.68,wing(),8)+g('translate(0 16) scale(-.68 .68) rotate(8)',wing())+star(0,14,5)+
        mirror(c(-17,26,6.8,ink,pale,1.3)+c(-17,26,3,'none',gold,.85))+at(0,-4,.7,crown())+star(0,-30,4);
      case 8: {
        const mane=p('M0 -31L6 -26L13 -28L16 -22L24 -23L24 -16L31 -12L28 -6L33 0L28 8L30 13L22 17L23 24L15 24L12 30L5 27L0 34L-5 27L-12 30L-15 24L-23 24L-22 17L-30 13L-28 8L-33 0L-28 -6L-31 -12L-24 -16L-24 -23L-16 -22L-13 -28L-6 -26Z',rose,pale,1.05);
        return mane+opacity(.68,ellipseRays(0,0,19,27,35,gold))+mirror(c(-15,-13,5,plum,gold,1))+
          p('M-16 -7Q-15 -19 0 -18Q15 -19 16 -7L12 9Q8 18 0 21Q-8 18 -12 9Z','#a2766a',pale,1.2)+
          mirror(p('M-12 -6Q-7 -10 -3 -4L-9 -3Z M-8 8Q-5 10 -2 7','none',ink,1.3))+p('M-4 3H4L0 8Z M0 8V12Q-3 15 -7 12 M0 12Q3 15 7 12',ink,ink,.95);
      }
      case 9: {
        const lantern=p('M-6 -3H6L4 8H-4Z',gold,pale,.9)+p('M-7 -4L0 -9L7 -4Z M-4 9H4','none',gold,1.1)+star(0,1,3.2,4,.3,plum);
        return p('M-23 30Q-16 11 -14 -13Q-12 -29 0 -35Q8 -33 13 -19L6 -14Q10 4 20 28Q3 39 -23 30Z',lilac,pale,1.2)+

function subjectFor(query,spread){

  if(/桃花|脫單|脱单|對象|暗戀|暗恋|告白|約會|约会|曖昧|暧昧|喜歡我|喜欢我|愛我嗎|在乎我|心儀|好感|交往|姻緣|遇到.{0,4}(?:愛情|愛的人)|crush/.test(q))return 'dating';
  if(/考試|考试|學業|学业|學習|学习|讀書|读书|成績|成绩|備考|上課|期中|期末|課業|課程|念書|準備.{0,5}考|考得|考上|會考|考運|exam/.test(q))return 'study';

  if(/工作|事業|事业|職場|職涯|職位|升遷|升职|升職|升官|加薪|主管|專案|项目|客戶|客户|同事|團隊|公司|合作|創業|创业|職務|work|career/.test(q))return 'work';
  if(/感情|爱情|愛情|關係|关系|另一半|伴侶|男友|女友|男朋友|女朋友|婚姻|婚|夫妻|吵架|冷戰|朋友|家人|爸|媽|孩子|相處|溝通|對方|分手|我們|友情|戀情|恋情|love/.test(q))return 'bond';
  if(/要不要|該不該|该不该|猶豫|抉擇|決定|選擇|选择|搬家|搬出去|搬出去住|留學|出國|該不該搬|哪個|哪一個|該選|比較好|二選一/.test(q))return 'choice';
  return spread===2?'bond':'daily';
}

  if(timing){
    const event={interview:'招募方說明下一關或給出書面通知',dating:'雙方願意安排下一次見面',reconnect:'對方主動聯絡，或清楚回應你的邀請',change:'你能核實新職位的工作內容與條件',work:'負責人確認下一個里程碑',study:'換一道同類題也能獨立完成',money:'收入入帳或支出實際結算',bond:'雙方都同意一個可以再談的時間'};

function positionNote(reading,entry,i){
  const advice=entry.advice;
  if(reading.spread===0)return ['對照今天',advice.question];
  if(reading.spread===2&&i===1)return ['可以向對方求證',dialogueQuestions[entry.mode]];
  if(i===0)return [reading.spread===1?'回看一次經驗':'從自己這邊看',advice.question];
  if(i===1){
    const card=deck[entry.id];
    return ['此刻可以核對',entry.mode===cardReadings[reading.cards[2].id][Number(reading.cards[2].rev)].mode?(entry.rev?card.reversed:card.upright):advice.signal];
  }
  const c=deck[entry.id];
  return [reading.spread===1?'接下來的提醒':'下一次互動',entry.rev?c.reversed:c.upright];
}

    return '過去的「'+a.cardName+'」帶出'+a.keyword+'，現在的「'+b.cardName+'」帶出'+b.keyword+'。'+bridge+'未來位置的「'+c.cardName+'」提示可從「'+c.keyword+'」著手，先試下面這一步。';

function interpretReading(reading){
  const subject=subjectFor(reading.q,reading.spread);
  const parts=reading.cards.map(({id,rev})=>{
    const c=deck[id],side=cardReadings[id][Number(rev)];
    return {id,rev,cardName:c.name,keyword:rev?c.down:c.up,...side,advice:adviceFor(subject,id,rev,side.mode)};
  });
  const last=parts[parts.length-1];
  return {subject,parts,headline:last.advice.headline,action:last.advice.action,signal:last.advice.signal,angle:questionAngle(reading.q,subject),story:together(reading,parts)};
}

><section class="wrap home-section" id="spreads"><div class="section-head"><div><div class="section-k"><span class="rule"></span> THE SPREADS</div><h2 tabindex="-1" id="spreadTitle">選擇你的牌陣</h2></div><p>從今天最想探索的問題開始。</p></div><div class="spread-grid">'+spreads.map((s,i)=>'<button class="spread-card" data-act="spread" data-id="'+i+'"><span class="meta"><span class="spread-en">'+s.en+'</span><span class="packnum">'+s.pos.length+' 張牌</span></span>'+thumb(i)+'<h3>'+s.name+'</h3><p>'+s.desc+'</p></button>').join('')+'</div></section>');}
function setup(){view='setup';const s=spreads[chosenSpread];shell(page(back('回到牌陣','spreads')+title(s.en,s.name)+steps(0)+'<div class="form-layout"><section class="box"><label class="fieldlabel" for="q">此刻，你想問什麼？ <small>選填</small></label><textarea id="q" maxlength="300" placeholder="例如：'+esc(s.examples[0])+'">'+esc(q)+'</textarea><div class="suggestions">'+s.examples.map((t,i)=>'<button class="chip" data-act="example" data-id="'+i+'">'+esc(t)+'</button>').join('')+'</div><label class="toggleline"><span>加入逆位牌<small>牌面倒轉時，會顯示另一種解讀。</small></span><input type="checkbox" role="switch" class="switch" id="reversals" '+(reversals?'checked':'')+'></label><div class="btns">'+btn('shuffle','洗牌，進入牌桌','shuffle')+'</div></section><aside class="box spread-summary">'+thumb(chosenSpread)+'<h2>牌陣位置</h2><ul class="placement-list">'+s.pos.map((x,i)=>'<li><b>'+x+'</b>'+s.labels[i]+'</li>').join('')+'</ul></aside></div>'))}
function rand(max){const n=new Uint32Array(1), limit=4294967296-4294967296%max;do{crypto.getRandomValues(n)}while(n[0]>=limit);return n[0]%max}
function shuffleDeck(){shuffled=deck.map(c=>c.id);for(let i=shuffled.length-1;i>0;i--){const j=rand(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}picks=[];pickedSlots=[];flipped=0;current=null;fromJournal=false;dealEnd=Date.now()+700;TarotSound.effect('shuffle')}
function draw(){view='draw';const s=spreads[chosenSpread],done=picks.length===s.pos.length;
const backs=Array.from({length:9},(_,i)=>'<button type="button" class="drawcard '+(pickedSlots.includes(i)?'taken':'')+'" style="--i:'+(i-4)+';--abs:'+Math.abs(i-4)+'" data-act="pick" data-id="'+i+'" aria-label="選擇第 '+(i+1)+' 張牌" '+(done||pickedSlots.includes(i)?'disabled':'')+'>'+TarotArt.back()+'</button>').join('');
shell(page(back('調整問題','setup')+title(s.en,'親手選出你的牌',done?'牌已選齊，現在可以開始翻牌。':'從牌列中選一張，放在「'+s.pos[picks.length]+'」的位置。')+steps(1)+(q?'<p class="question">「'+esc(q)+'」</p>':'')+'<div class="tabletop"><div class="fan '+(Date.now()<dealEnd?'shuffling':'')+'" aria-label="待選牌列">'+backs+'</div><div class="slots">'+s.pos.map((p,i)=>'<span class="slot '+(i<picks.length?'chosen':i===picks.length?'next':'')+'"><span class="slot-art" aria-hidden="true">'+(i<picks.length?TarotArt.back():'✧')+'</span><span>'+p+'</span></span>').join('')+'</div><div class="table-actions btns">'+btn('redeal','重新洗牌','shuffle','ghost')+btn('read','開始翻牌','cards','gold',!done)+'</div></div>','drawpage'))}
function makeReading(){return {id:Date.now().toString(36)+'-'+rand(10000000).toString(36),at:Date.now(),spread:chosenSpread,q,cards:picks.map(c=>({...c}))}}
function flyToSlot(source,index){
 const dest=main.querySelectorAll('.slot-art')[index];
 if(!dest||matchMedia('(prefers-reduced-motion: reduce)').matches||!Element.prototype.animate)return;
 const target=dest.getBoundingClientRect(),piece=document.createElement('div');
 piece.className='flight-card';piece.setAttribute('aria-hidden','true');piece.innerHTML=TarotArt.back();
 Object.assign(piece.style,{left:source.left+'px',top:source.top+'px',width:source.width+'px',height:source.height+'px'});
 document.body.append(piece);
 const dx=target.left-source.left,dy=target.top-source.top,scale=target.width/source.width;
 const animation=piece.animate([{transform:'translate(0,0) scale(1)',opacity:1},{offset:.38,transform:'translate('+dx*.42+'px,'+(dy*.32-13)+'px) scale(.76) rotate(-8deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+scale+')',opacity:.9}],{duration:420,easing:'cubic-bezier(.25,.7,.3,1)'});
 animation.onfinish=()=>piece.remove();animation.oncancel=()=>piece.remove();
}
function focusNextPick(){const node=main.querySelector('.drawcard:not(:disabled),[data-act=read]:enabled');if(node)node.focus({preventScroll:true})}
function readingOverview(r,reading){
  const heading=r.spread===0?'這張牌給你的回答':'整組牌給你的回答';
  const angle=reading.angle?'<p class="read-angle">'+esc(reading.angle)+'</p>':'';
  const combined=r.cards.length>1?'<p class="read-story">'+esc(reading.story)+'</p>':'';
  return '<section class="read-overview" aria-labelledby="read-title"><div class="section-k"><span class="rule"></span>'+heading+'</div><h2 id="read-title">'+esc(reading.headline)+'</h2>'+angle+combined+
    '<dl class="read-next"><div><dt>先做一件事</dt><dd>'+esc(reading.action)+'</dd></div><div><dt>之後觀察</dt><dd>'+esc(reading.signal)+'</dd></div></dl></section>';
}
function result(){
  view='result';
  const r=current,s=spreads[r.spread],n=r.cards.length,all=flipped===n;
  const saved=getJournal().some(x=>x.id===r.id),reading=interpretReading(r);
  const cards=reading.parts.map((entry,i)=>{
    const seen=i<flipped,position=s.pos[i];
    if(!seen)return '<article class="reading"><div class="section-k">'+esc(position)+'</div><button class="art facebtn" data-act="flip" aria-label="翻開'+esc(position)+'的牌" '+(i!==flipped?'disabled':'')+'>'+TarotArt.back()+'</button><h3>'+(i===flipped?'點一下翻牌':'尚待翻開')+'</h3><p>'+esc(s.labels[i])+'</p></article>';
    const [noteTitle,note]=positionNote(r,entry,i);
    const artClass=(flipped-1===i&&!fromJournal?'reveal ':'')+(entry.rev?'reverse':'');
    return '<article class="reading"><div class="section-k">'+esc(position)+'</div><div class="art '+artClass+'">'+TarotArt.face(entry.id)+'</div><h3>'+esc(entry.cardName)+' <small>'+(entry.rev?'逆位':'正位')+'</small></h3><p><b>'+esc(entry.keyword)+'</b> · '+esc(entry.meaning)+'</p><p class="lens"><b>'+noteTitle+'</b>'+esc(note)+'</p></article>';
  }).join('');
  const actions=all?btn('save',saved?'已存入手記':'存入占卜手記',saved?'check':'note','gold',saved)+btn('spreads','再占卜一次','cards','ghost'):btn('flip','翻開「'+s.pos[flipped]+'」','spark');
  const previous=fromJournal?back('回到占卜手記','journal'):back('回到牌陣','spreads');
  const userQuestion=r.q?'<p class="resultq">你的問題　「'+esc(r.q)+'」</p>':'';
  shell(page(previous+title(s.en,s.name+' · '+(all?'牌面解讀':'翻開牌面'))+steps(2)+userQuestion+
    (all?readingOverview(r,reading):'')+'<div class="results '+(n===1?'one':'')+'" style="--count:'+n+'">'+cards+'</div><div class="btns">'+actions+'</div>'));
}
function library(){view='library';shell(page(title('THE CARD ARCHIVE','牌義圖鑑','翻閱 78 張塔羅牌，點開牌面可對照正、逆位解讀。')+'<div class="searchrow"><input type="search" id="cardSearch" value="'+esc(search)+'" placeholder="搜尋牌名或關鍵字" aria-label="搜尋牌名或關鍵字"><span id="cardCount" role="status"></span></div><div class="filters" aria-label="牌組篩選">'+['全部','大阿爾克那','權杖','聖杯','寶劍','錢幣'].map((x,i)=>'<button class="chip" aria-pressed="'+(x===filter)+'" data-act="filter" data-id="'+i+'">'+x+'</button>').join('')+'</div><div class="cardgrid" id="cardgrid"></div>'));fillGrid()}
function fillGrid(){const key=search.trim().toLowerCase(),list=deck.filter(c=>(filter==='全部'||c.group===filter)&&[c.name,c.en,c.up,c.down].some(v=>v.toLowerCase().includes(key)));$('#cardCount').textContent=list.length+' 張';$('#cardgrid').innerHTML=list.map(c=>'<button class="cardtile" data-act="card" data-id="'+c.id+'"><span class="art">'+TarotArt.face(c.id)+'</span><b>'+c.name+'</b><small lang="en">'+c.en+'</small></button>').join('')||'<p class="hint">沒有符合的牌，試試其他名稱或關鍵字。</p>'}
function journal(){view='journal';const all=getJournal();shell(page(title('THE READING JOURNAL','占卜手記','回看你親手儲存的牌陣。紀錄保存在目前使用的瀏覽器。')+'<div class="journal-list">'+(all.length?all.map(r=>'<article class="journal-item"><button data-act="openreading" data-id="'+esc(r.id)+'"><small>'+new Date(r.at).toLocaleString('zh-TW',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</small><h3>'+spreads[r.spread].name+'</h3><span>'+esc(r.q||r.cards.map(c=>deck[c.id].name).join(' · '))+'</span></button><button class="iconbtn" data-act="delete" data-id="'+esc(r.id)+'" aria-label="刪除這篇紀錄">'+icon('trash')+'</button></article>').join(''):'<div class="box empty">'+icon('note')+'<h3>這裡等著你的第一篇手記</h3><p>占卜後按「存入占卜手記」，就能在這裡重新翻閱。</p>'+btn('spreads','挑選牌陣','cards')+'</div>')+'</div>'))}
function showModal(titleText,body){$('#modalInside').innerHTML='<div class="modalhead"><h2 id="modalTitle">'+esc(titleText)+'</h2><button data-act="close" aria-label="關閉">×</button></div>'+body;if(!modal.open)modal.showModal()}
function showCard(id){const c=deck[id];showModal(c.name,'<div class="modalcopy"><div class="modal-art art">'+TarotArt.face(id)+'</div><div class="section-k">'+esc(c.en)+'</div><h3>正位 · '+c.up+'</h3><p>'+c.upright+'</p><h3>逆位 · '+c.down+'</h3><p>'+c.reversed+'</p></div>')}
function guide(){showModal('使用指南','<div class="modalcopy"><h3>① 選定問題與牌陣</h3><p>每日一牌適合日常反思，時間之流從三個時間點觀察事情，關係之鏡提供三個相處的角度。</p><h3>② 洗牌、選牌、翻牌</h3><p>寫下問題或直接洗牌。依提示選滿張數，再點牌背逐張翻開。每次洗牌都會重新打亂全部 78 張牌。</p><h3>③ 聆聽與記錄</h3><p>點右上角開啟原創配樂，旁邊的選單可調音量。解讀後可將牌陣存入這個瀏覽器的手記。</p><p>塔羅可作為自我探索的提問工具。牌面提供的是思考角度，選擇仍由你做出。</p></div>')}
function goSpreads(){home();const h=$('#spreadTitle');h.focus({preventScroll:true});$('#spreads').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
function audioUi(){const on=TarotSound.isPlaying();$('#audioToggle').setAttribute('aria-pressed',String(on));$('#audioText').textContent=on?'音樂播放中':'開啟音樂'}
async function toggleMusic(){if(busyMusic)return;busyMusic=true;try{if(TarotSound.isPlaying()){TarotSound.stop()}else{TarotSound.setVolume(volume);const ok=await TarotSound.start();if(!ok)notify('這個瀏覽器目前無法播放音樂。')}}catch{notify('音樂暫時無法播放，可再次點選重試。')}finally{busyMusic=false;audioUi()}}
function closeVolume(){$('#volumePanel').hidden=true;document.querySelector('.volumeBtn').setAttribute('aria-expanded','false')}
let lastKeyboard=false;
document.addEventListener('keydown',e=>{lastKeyboard=true;if(e.key==='Escape')closeVolume()});document.addEventListener('pointerdown',()=>lastKeyboard=false);
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-act]');if(!e.target.closest('.soundctrl'))closeVolume();if(e.target===modal){const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)modal.close()}if(!button||button.disabled)return;
 const act=button.dataset.act,id=button.dataset.id,i=Number(id);
 switch(act){
 case 'home':home();goTop();break;
 case 'start':case 'spreads':goSpreads();break;
 case 'spread':chosenSpread=i;q='';picks=[];current=null;setup();goTop();break;
 case 'setup':setup();goTop();break;
 case 'example':q=spreads[chosenSpread].examples[i];$('#q').value=q;$('#q').focus();break;
 case 'shuffle':q=$('#q').value.trim();reversals=$('#reversals').checked;shuffleDeck();draw();goTop();break;
 case 'redeal':shuffleDeck();draw();announce('洗牌完成');if(lastKeyboard)focusNextPick();break;
 case 'pick':if(view!=='draw'||picks.length>=spreads[chosenSpread].pos.length||pickedSlots.includes(i))break;var startBox=button.getBoundingClientRect();pickedSlots.push(i);picks.push({id:shuffled[i],rev:reversals&&rand(2)===1});dealEnd=0;TarotSound.effect('pick');draw();flyToSlot(startBox,picks.length-1);announce('已選 '+picks.length+' 張');if(lastKeyboard)focusNextPick();break;
 case 'read':if(view==='draw'&&picks.length===spreads[chosenSpread].pos.length){current=makeReading();flipped=0;result();goTop()}break;
 case 'flip':if(view!=='result'||flipped>=current.cards.length)break;flipped++;TarotSound.effect('reveal');result();announce('翻開了'+deck[current.cards[flipped-1].id].name);if(lastKeyboard)main.querySelector('.btn[data-act=flip],.btn[data-act=save]')?.focus({preventScroll:true});break;
 case 'save':if(!current||flipped!==current.cards.length)break;{const all=getJournal();if(!all.some(r=>r.id===current.id)&&writeJournal([current,...all])){TarotSound.effect('save');result();notify('這次占卜已存入手記。')}}break;
 case 'library':filter='全部';search='';library();goTop();break;
 case 'filter':filter=['全部','大阿爾克那','權杖','聖杯','寶劍','錢幣'][i];document.querySelectorAll('[data-act=filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fillGrid();break;
 case 'card':showCard(i);break;
 case 'journal':journal();goTop();break;
 case 'openreading':{const found=getJournal().find(r=>r.id===id);if(found){current=found;fromJournal=true;flipped=current.cards.length;result();goTop()}}break;
 case 'delete':showModal('刪除這篇手記？','<div class="modalcopy"><p>刪除後將無法恢復這次的牌陣紀錄。</p></div><div class="btns" style="margin-top:17px"><button class="btn ghost" data-act="close">保留手記</button><button class="btn gold" data-act="confirmdelete" data-id="'+esc(id)+'">刪除手記</button></div>');break;
 case 'confirmdelete':if(writeJournal(getJournal().filter(r=>r.id!==id))){modal.close();journal();notify('手記已刪除。')}break;
 case 'close':modal.close();break;case 'guide':guide();break;case 'music':toggleMusic();break;
 case 'volume':{const panel=$('#volumePanel');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)$('#vol').focus()}break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='cardSearch'){search=e.target.value;fillGrid()}else if(e.target.id==='vol'){volume=Number(e.target.value)/100;TarotSound.setVolume(volume);$('#volValue').textContent=e.target.value+'%';try{localStorage.setItem(volumeKey,String(volume))}catch{}}else if(e.target.id==='q'){q=e.target.value}});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const hero=e.target.closest('.hero');if(!hero)return;const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5)*7+'px');hero.style.setProperty('--my',((e.clientY-r.top)/r.height-.5)*5+'px')},{passive:true});
$('#vol').value=String(Math.round(volume*100));$('#volValue').textContent=$('#vol').value+'%';TarotSound.setVolume(volume);home();
</script>
</body></html>
