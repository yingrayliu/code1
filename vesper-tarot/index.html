function casebook(rows){
  return Object.fromEntries(rows.trim().split('\n').map(line=>{
    const [headline,question,action,signal]=line.slice(2).split('|');
    return [line[0],{headline,question,action,signal}];
  }));
}

function subjectFor(query,spread){
  const q=query.normalize('NFKC').toLowerCase().replace(/\s+/g,'');
  if(/面試|面试|錄取|录取|應徵|应聘|求職|求职|找工作|找得到工作|找到工作|投履歷|面談|interview/.test(q))return 'interview';

  if(/復合|复合|前任|舊愛|断联|斷聯|分手後|分手后|挽回|重新聯絡|重新联系|回心轉意|回到我身邊|[他她對对].{0,9}(?:回來|回来|回我|找我|聯絡我|联系我|回訊息|回消息)|等.{0,6}(?:訊息|消息|回覆)/.test(q))return 'reconnect';
  if(/桃花|脫單|脱单|對象|暗戀|暗恋|告白|約會|约会|曖昧|暧昧|喜歡我|喜欢我|愛我嗎|在乎我|心儀|好感|交往|姻緣|遇到.{0,4}(?:愛情|愛的人)|crush/.test(q))return 'dating';
  if(/考試|考试|學業|学业|學習|学习|讀書|读书|成績|成绩|備考|上課|期中|期末|課業|課程|念書|準備.{0,5}考|考得|考上|會考|考運|exam/.test(q))return 'study';
  if(/理財|理财|金錢|金钱|財運|财运|預算|预算|帳單|存款|存錢|存钱|投資|投资|股票|花費|支出|收入|負債|房貸|儲蓄|基金|加密貨幣|money/.test(q))return 'money';
  if(/工作|事業|事业|職場|職涯|職位|升遷|升职|升職|升官|加薪|主管|專案|项目|客戶|客户|同事|團隊|公司|合作|創業|创业|職務|work|career/.test(q))return 'work';
  if(/感情|爱情|愛情|關係|关系|另一半|伴侶|男友|女友|男朋友|女朋友|婚姻|婚|夫妻|吵架|冷戰|朋友|家人|爸|媽|孩子|相處|溝通|對方|分手|我們|友情|戀情|恋情|love/.test(q))return 'bond';

  return spread===2?'bond':'daily';
}
function questionAngle(query,subject){
  const q=query.replace(/\s+/g,'');
  const timing=/何時|何时|什麼時候|什么时候|多久|幾時|幾天|幾月|哪天|哪一天|何年|when/i.test(q);
  if(timing){
    const event={interview:'招募方說明下一關或給出書面通知',dating:'雙方願意安排下一次見面',reconnect:'對方主動聯絡，或清楚回應你的邀請',change:'你能核實新職位的工作內容與條件',work:'負責人確認下一個里程碑',study:'換一道同類題也能獨立完成',money:'收入入帳或支出實際結算',bond:'雙方都同意一個可以再談的時間'};
    return event[subject]?'關於時間，這次可用「'+event[subject]+'」作為進度線索；牌面無法給出確切日期。':'關於時間，可以等下方的觀察線索出現，再決定是否推進。';
  }
  if(subject==='reconnect'&&/會|会|能不能|還|还|有沒有|想我/.test(q))return '對方會不會回來，仍要由對方的選擇確認。這組牌能幫你分辨回應、等待與下一步的界線。';
  if(subject==='dating'&&/喜歡我|喜欢我|愛我|爱我|對我.{0,4}(?:意思|好感|感覺)|在想什麼/.test(q))return '對方的心意要透過本人表態和行動確認，可以先看互動裡有沒有來回。';
  if(subject==='interview'&&/會|能|有没有|有沒有|機會|成功/.test(q))return '正式通知才能確認錄取結果，這次牌面較適合用來判斷你還能主動做哪一步。';
  if(subject==='money'&&/漲|跌|獲利|報酬|買入|賣出|會賺|翻倍|上漲|中獎/.test(q))return '牌面無法判定漲跌或獲利；以下解讀聚焦在你能核對的金額、條件和承擔範圍。';
  return '';
}

function positionNote(reading,entry,i){
  const advice=entry.advice;
  if(reading.spread===0)return ['對照今天',advice.question];
  if(reading.spread===2&&i===1)return ['可以向對方求證',dialogueQuestions[entry.mode]];
  if(i===0)return [reading.spread===1?'回看一次經驗':'從自己這邊看',advice.question];
  if(i===1){
    const card=deck[entry.id];
    return ['此刻可以核對',entry.mode===cardReadings[reading.cards[2].id][Number(reading.cards[2].rev)].mode?(entry.rev?card.reversed:card.upright):advice.signal];
  }
  const c=deck[entry.id];
  return [reading.spread===1?'接下來的提醒':'下一次互動',entry.rev?c.reversed:c.upright];
}
function together(reading,parts){
  const [a,b,c]=parts;
  if(!b)return '';
  if(reading.spread===1){
    const bridge=timeLinks[modeGroups[a.mode]][modeGroups[b.mode]];
    return '過去的「'+a.cardName+'」帶出'+a.keyword+'，現在的「'+b.cardName+'」帶出'+b.keyword+'。'+bridge+'未來位置的「'+c.cardName+'」提示可從「'+c.keyword+'」著手，先試下面這一步。';
  }
  const connector=modeGroups[a.mode]===modeGroups[b.mode]?'兩個位置的重點相近，適合比較你和對方對同一件事的理解。':'這兩個位置提供不同角度。先說出自己的一個具體經驗，再聽對方怎麼描述同一件事。';
  return '「'+a.cardName+'」落在你的位置，提醒你留意'+a.keyword+'；「'+b.cardName+'」落在對方的位置，可把「'+b.keyword+'」當成談話線索。'+connector+'兩人的相處則由「'+c.cardName+'」點出'+c.keyword+'，可用下面的行動觀察。';
}
function interpretReading(reading){
  const subject=subjectFor(reading.q,reading.spread);
  const parts=reading.cards.map(({id,rev})=>{
    const c=deck[id],side=cardReadings[id][Number(rev)];
    return {id,rev,cardName:c.name,keyword:rev?c.down:c.up,...side,advice:adviceFor(subject,id,rev,side.mode)};
  });
  const last=parts[parts.length-1];
  return {subject,parts,headline:last.advice.headline,action:last.advice.action,signal:last.advice.signal,angle:questionAngle(reading.q,subject),story:together(reading,parts)};
}

const tenGodGloss={比肩:'自主與並肩合作',劫財:'同伴與資源分配',食神:'示範與表達',傷官:'發現問題與改進',偏財:'調度資源與掌握機會',正財:'落實安排與守約',七殺:'應對壓力與時限',正官:'規則與責任',偏印:'另找角度與驗證',正印:'學習與支持'};

function readStructure(b){
  const day=b.day.upper,month=b.month, roots=[],resources=[],helpers=[],others=[];
  b.pillars.forEach((p,i)=>{
    const position=pillarLabels[i][0];
    p.hidden.forEach((s,j)=>{
      const role=elementStep(day,stemElement(s)),text=position+'支'+p.branch+'藏'+s;
      if(role===0)roots.push({text,main:j===0});
      if(role===4)resources.push(text);
    });
    if(i!==2){
      const role=elementStep(day,p.upper);
      const item=position+'干'+p.stem+'（'+stemGod(b.day.stem,p.stem)+'）';
      (role===0||role===4?helpers:others).push(item);
    }
  });
  const season=elementStep(day,month.lower), backing=season===0||season===4;
  const baseRoot=roots.some(r=>r.main),rooted=roots.length>0;
  let headline;
  if(backing&&baseRoot)headline='月支本氣生扶日主，地支也有本氣根';
  else if(backing&&rooted)headline='月令有助，根氣藏在地支裡';
  else if(backing)headline='出生月份相助，四支少了同類根氣';
  else if(baseRoot)headline='月令不直接生扶，地支本氣仍有根';
  else if(rooted)headline='月令不直接生扶，仍有藏根可用';
  else if(helpers.length||resources.length)headline='四支未見同類根，支持來自別處';
  else headline='月令與四支都少見直接生扶';
  const seasonText=[
    '月支本氣與日主同五行，依這一項看，日主得令。',
    '日主生月支本氣，月令的方向偏向日主向外輸出。',
    '月支本氣是日主所剋的五行，傳統上歸為財，重點在日主是否另有支持來承擔。',
    '月支本氣剋日主，月令帶來約束，要連同印星與根氣一起讀。',
    '月支本氣生日主，出生月份提供印星的支持。'
  ][season];
  const rootsText=rooted?roots.map(r=>r.text+'（'+(r.main?'本氣':'其餘藏干')+'）').join('、')+'與日主同屬'+day+'，是這張盤可指認的根。':'逐一查看'+b.pillars.map(p=>p.branch).join('、')+'四支的藏干，都沒有'+day+'。以本頁的同五行口徑，日主未見通根。';
  let supportText=helpers.length?helpers.join('、')+'在天干直接生扶日主。':'年、月、時干沒有直接生扶日主的印星或比劫。';
  if(resources.length)supportText+='地支另見'+resources.join('、')+'，屬於生'+day+'的印星。';
  if(others.length)supportText+='同時可見'+others.join('、')+'，讀盤時也要算進日主的輸出、耗力或約束。';
  let takeaway;
  if(backing&&baseRoot)takeaway='月支提供生扶，'+roots.filter(r=>r.main).map(r=>r.text).join('、')+'又給日主同類本氣根，兩項依據指向較明顯的支持。';
  else if(!backing&&!rooted){
    if(helpers.length)takeaway='此盤先看'+helpers.join('、')+'如何扶'+day+'。日主得到天干支援，但四支沒有同類根，兩者要分開衡量。';
    else if(resources.length)takeaway='這張盤能指認的印星在'+resources.join('、')+'。月令、同類根與透出的印比三方面，對日主的直接支持較少。';
    else takeaway='月令不直接生扶，四支也沒有同類根，其他三個天干均未見印比。依這三項，日主得到的支持較少。';
  }else if(!backing&&rooted)takeaway='出生月份沒有直接生扶，'+roots.map(r=>r.text).join('、')+'卻保留了'+day+'根。單從生月判弱，會漏掉這條線索。';
  else takeaway='這張盤的支持首先來自'+month.branch+'月的'+month.lower+'。'+(rooted?'地支也留下同類藏根，其分量需與全盤一同看。':'地支未見同類根，判讀時需保留這項限制。');
  return {headline,seasonText,rootsText,supportText,takeaway};
}
function pillarEvidence(b){

function elementPresence(b,element){
  const visible=[], concealed=[];
  b.pillars.forEach((p,i)=>{
    const pos=pillarLabels[i][0];
    if(p.upper===element)visible.push(pos+'干'+p.stem);
    if(p.lower===element)visible.push(pos+'支'+p.branch+'的本氣'+p.hidden[0]);
    for(const s of p.hidden.slice(1))if(stemElement(s)===element)concealed.push(pos+'支'+p.branch+'藏'+s);
  });
  if(visible.length)return '命盤可在'+visible.join('、')+'找到'+element+'。';
  if(concealed.length)return '八個明字沒列出'+element+'，但'+concealed.join('、')+'仍可見這一行。';
  return '四柱明字及所列藏干都未見'+element+'。姓名數理提供的是另一種象徵。';
}

function timeBoundary(b,calendar){

    const iso=new Date(local+delta*60000).toISOString();
    const alternative=makeBirthChart({date:iso.slice(0,10),time:iso.slice(11,16),offset:birth.offset},calendar);

function characterRadical(character){
  if(!radicalRanges){
    const bytes=atob(radicalData);
    let cursor=0, next=0;
    function number(){
      let value=0, factor=1, byte;
      do {byte=bytes.charCodeAt(cursor++);value+=(byte%128)*factor;factor*=128;} while(byte>=128);
      return value;
    }
    radicalRanges=[];
    while(cursor<bytes.length){
      const start=next+number(), end=start+number(), radical=number();
      radicalRanges.push({start,end,radical});next=end+1;
    }
  }
  const point=character.codePointAt(0);
  let lo=0, hi=radicalRanges.length-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1, range=radicalRanges[mid];
    if(point<range.start)hi=mid-1;
    else if(point>range.end)lo=mid+1;
    else return String.fromCodePoint(0x2f00+range.radical-1).normalize('NFKC');
  }
  return '';
}

function balanceDirection(b){
  const day=b.day.upper, related=e=>[0,4].includes(elementStep(day,e));
  const season=related(b.month.lower)?2:0;
  const hasMain=b.pillars.some(p=>p.lower===day),hasRoot=b.pillars.some(p=>p.hidden.some(h=>stemElement(h)===day));
  const roots=hasMain?2:hasRoot?1:0;
  const peers=Math.min(2,b.pillars.filter((p,i)=>i!==2&&related(p.upper)).length);
  const total=season+roots+peers;
  const side=total<=2?'扶助':total>=4?'疏通':'均衡';
  const groups=side==='扶助'?[0,4]:side==='疏通'?[1,2,3]:[];
  const likes=nameElements.filter(e=>groups.includes(elementStep(day,e)));
  const reason='出生月份'+(season?'能':'較少')+'直接支持'+day+'，四柱中'+(hasMain?'有一柱以上以'+day+'為主要五行':hasRoot?'有'+day+'藏在地支裡':'沒有找到同屬'+day+'的根')+'。';

}

  const birthScore=direction&&direction.likes.length&&known.length===letters.length?
    average(known.map(ch=>direction.likes.includes(ch.element)?2:0)):null;

function nameElement(n) { return nameElements[Math.floor(((n + 9) % 10) / 2)]; }
function nameRelation(a, b) {
  const distance = (nameElements.indexOf(b) - nameElements.indexOf(a) + 5) % 5;
  if (!distance) return {kind:'同行', bond:a+'與'+b+'同行', score:1, source:0};
  const feeds = distance === 1 || distance === 4;
  const source = distance === 1 || distance === 2 ? 0 : 1;
  const order = source ? [b,a] : [a,b];
  return {kind:feeds?'相生':'相剋', bond:order.join(feeds?'生':'剋'), score:feeds?2:0, source};
}
function nameChart(family, given, overrides = new Map()) {
  const count = c => kangxiStrokes(c) || overrides.get(c);
  const f = Array.from(family,count), g = Array.from(given,count);
  const add = list => list.reduce((sum,n) => sum+n,0);
  const ft = add(f), gt = add(g), sky = ft + Number(f.length===1), earth = gt + Number(g.length===1);
  const person = f.at(-1)+g[0];
  const values = [sky, person, earth, sky+earth-person, ft+gt];
  const factors = [
    [...f,...(f.length===1?[1]:[])].join(' ＋ '),
    f.at(-1)+' ＋ '+g[0],
    [...g,...(g.length===1?[1]:[])].join(' ＋ '),
    sky+' ＋ '+earth+' − '+person,
    [...f,...g].join(' ＋ ')
  ];
  return {full:family+given, family, given, values, factors, elements:values.map(nameElement),
    strokes:Array.from(family+given,c=>({c,n:count(c),manual:!kangxiStrokes(c)}))};
}

      button.disabled=true;form.setAttribute('aria-busy','true');
      try{
        const calendar=await getBirthCalendar();
        if(!form.isConnected||ticket!==request||version!==revision)return;
        if(!unsure?.checked)charts.forEach((person,i)=>person.bazi=makeBirthChart(birthData[i],calendar));
        if(!pair)charts[0].birthDate=birthData[0].date;
        output.innerHTML=pair?baziMatchResult(charts):nameSingleResult(charts[0],calendar);
      }catch{
        if(form.isConnected && ticket===request && version===revision){
          error.textContent='暫時無法排盤。請確認連線後再按一次，已填資料會保留。';error.hidden=false;
        }
        return;
      }finally{
        if(ticket===request && version===revision){button.disabled=false;form.removeAttribute('aria-busy');}
      }
    }else output.innerHTML=nameMatchResult(charts);
    if(!pair)output.closest('.names-page').classList.add('report-open');
    const resultTitle=output.querySelector(pair?'h2':'h1');resultTitle.focus({preventScroll:true});
    output.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
  });

function nameMatchResult(charts){
  const [a,b]=charts;
  const facets=namePairTopics.map(topic=>{
    const index=topic.index, r=nameRelation(a.elements[index],b.elements[index]);
    const from=esc(charts[r.source].full), to=esc(charts[1-r.source].full);
    let note;
    if(r.kind==='相生')note='以五行的比喻來看，'+from+'可以先給出起點，再讓'+to+'接續發展。';
    else if(r.kind==='相剋')note='在這個面向，'+from+'的做法可能讓'+to+'感到受限。先比對雙方期待，是這一組的練習。';
    else note='兩個名字在這一格都屬'+a.elements[index]+'，可以從相似的習慣找話題，也留意彼此有哪裡不同。';
    return {topic,r,note,action:topic[r.kind==='相生'?'feed':r.kind==='同行'?'same':'check']};
  });
  const score=facets.reduce((sum,f)=>sum+f.r.score,0), counts=[2,1,0].map(n=>facets.filter(f=>f.r.score===n).length);
  return '<section class="name-reading"><div class="section-k"><span class="rule"></span> 僅用姓名簡測</div><h2 tabindex="-1">'+esc(a.full)+' <span class="name-cross">與</span> '+esc(b.full)+'</h2>'+
    '<div class="pair-score"><div><span>姓名筆畫呼應</span><strong>'+score+' <small>/ 6</small></strong></div><p><b>'+ (score>=5?'姓名呼應較多':score>=3?'姓名部分呼應':'姓名差異較多')+'。</b>三項對照中有 '+counts[0]+' 項相生、'+counts[1]+' 項同行、'+counts[2]+' 項相剋。分數呈現姓名五行的組合，無法衡量感情好壞。</p></div>'+
    '<div class="pair-facets">'+facets.map(({topic,r,note,action})=>'<article><div class="facet-top"><h3>'+topic.title+'</h3><span>'+r.kind+' · '+r.score+' / 2</span></div><p class="facet-elements">'+nameGrids[topic.index][0]+'　'+esc(a.full)+' '+a.values[topic.index]+'（'+a.elements[topic.index]+'） × '+esc(b.full)+' '+b.values[topic.index]+'（'+b.elements[topic.index]+'）</p><p><b>'+r.bond+'。</b>'+note+'</p><p class="facet-action"><strong>一起試試</strong>'+action+'</p></article>').join('')+'</div>'+nameMath(a)+nameMath(b)+'</section>';
}

function setup(){view='setup';const s=spreads[chosenSpread];shell(page(back('回到牌陣','spreads')+title(s.en,s.name)+steps(0)+'<div class="form-layout"><section class="box"><label class="fieldlabel" for="q">此刻，你想問什麼？ <small>選填</small></label><textarea id="q" maxlength="300" placeholder="例如：'+esc(s.examples[0])+'">'+esc(q)+'</textarea><div class="suggestions">'+s.examples.map((t,i)=>'<button class="chip" data-act="example" data-id="'+i+'">'+esc(t)+'</button>').join('')+'</div><label class="toggleline"><span>加入逆位牌<small>牌面倒轉時，會顯示另一種解讀。</small></span><input type="checkbox" role="switch" class="switch" id="reversals" '+(reversals?'checked':'')+'></label><div class="btns">'+btn('shuffle','洗牌，進入牌桌','shuffle')+'</div></section><aside class="box spread-summary">'+thumb(chosenSpread)+'<h2>牌陣位置</h2><ul class="placement-list">'+s.pos.map((x,i)=>'<li><b>'+x+'</b>'+s.labels[i]+'</li>').join('')+'</ul></aside></div>'))}
function rand(max){const n=new Uint32Array(1), limit=4294967296-4294967296%max;do{crypto.getRandomValues(n)}while(n[0]>=limit);return n[0]%max}
function shuffleDeck(){shuffled=deck.map(c=>c.id);for(let i=shuffled.length-1;i>0;i--){const j=rand(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}picks=[];pickedSlots=[];current=null;fromJournal=false;TarotSound.effect('shuffle')}
function drawHint(positions,count){
  return count===positions.length?'牌已選齊，正在為你翻牌與解讀。':'從牌列中選一張，放在「'+positions[count]+'」的位置。'+(count===0?'選滿後會自動解牌。':'');
}
function draw(redeal=false){
  view='draw';
  const spread=spreads[chosenSpread];
  const backs=Array.from({length:9},(_,i)=>'<button type="button" class="drawcard" style="--i:'+(i-4)+';--abs:'+Math.abs(i-4)+'" data-act="pick" data-id="'+i+'" aria-label="選擇第 '+(i+1)+' 張牌">'+TarotArt.back()+'</button>').join('');
  const slots=spread.pos.map((label,i)=>'<span class="slot '+(i===0?'next':'')+'"><span class="slot-art" aria-hidden="true">✧</span><span>'+esc(label)+'</span></span>').join('');
  const fan='<div class="fan" aria-label="待選牌列"><div class="shuffle-light" aria-hidden="true"><i></i><i></i></div>'+backs+'</div>';
  const actions='<div class="table-actions btns">'+btn('redeal','重新洗牌','shuffle','ghost')+'</div>';
  shell(page(back('調整問題','setup')+title(spread.en,'親手選出你的牌',drawHint(spread.pos,0))+steps(1)+(q?'<p class="question">「'+esc(q)+'」</p>':'')+
    '<div class="tabletop">'+fan+'<div class="slots">'+slots+'</div>'+actions+'</div>','drawpage'));
  const fanNode=main.querySelector('.fan');
  runShuffle(fanNode,redeal);
}
function runShuffle(fan,redeal){
  const cards=[...fan.querySelectorAll('.drawcard')];
  const board=fan.closest('.tabletop');
  const hint=main.querySelector('.subhead p');
  const heading=main.querySelector('.subhead h1');
  const shuffleButton=board.querySelector('[data-act=redeal]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  if(reduced.matches||!fan.animate){
    announce('洗牌完成。'+hint.textContent);
    if(redeal&&lastKeyboard)focusNextPick();
    return;
  }
  board.classList.add('mixing');
  fan.setAttribute('aria-busy','true');
  heading.textContent='正在洗牌';
  hint.textContent='牌疊一分為二、交錯合攏，再展開讓你選牌。';
  cards.forEach(card=>card.disabled=true);
  shuffleButton.dataset.act='skipshuffle';
  shuffleButton.innerHTML=icon('cards')+'略過洗牌動畫';
  announce('正在洗牌，可以略過動畫。');
  const distance=Math.min(fan.clientWidth*.20,115);
  const animations=cards.map((card,i)=>{
    const side=i%2?1:-1, layer=Math.floor(i/2);
    const final=getComputedStyle(card).transform;
    const pose=(x,y,turn,scale=1)=>'translateX(calc(-50% + '+x+'px)) translateY('+y+'px) rotate('+turn+'deg) scale('+scale+')';
    const stack=pose((i-4)*.8,9-i*1.2,0);
    const cut=pose(side*(distance+layer*1.4),2-layer*2.6,side*(7+layer*.6),1.02);
    const riffle=pose(side*(distance*.45+layer*4),-13-layer*2,side*-6);
    return card.animate([
      {offset:0,transform:redeal?final:stack},{offset:.14,transform:stack},
      {offset:.32,transform:cut},{offset:.43,transform:cut},
      {offset:.49+i*.013,transform:riffle},{offset:.65+i*.012,transform:stack},
      {offset:.77,transform:stack},{offset:1,transform:final}
    ],{duration:1740+i*18,fill:'both',easing:'ease-in-out'});
  });
  function finish(){
    const onBoard=fan.isConnected;
    const focusAfter=onBoard&&lastKeyboard&&(document.activeElement===shuffleButton||document.activeElement===main||document.activeElement===document.body);
    skipShuffle=null;
    reduced.removeEventListener?.('change',onPreferenceChange);
    animations.forEach(animation=>animation.cancel());
    if(!onBoard)return;
    board.classList.remove('mixing');
    fan.removeAttribute('aria-busy');
    cards.forEach(card=>card.disabled=false);
    shuffleButton.dataset.act='redeal';
    shuffleButton.innerHTML=icon('shuffle')+'重新洗牌';
    heading.textContent='親手選出你的牌';
    hint.textContent=drawHint(spreads[chosenSpread].pos,0);
    announce('洗牌完成。'+hint.textContent);
    if(focusAfter)focusNextPick();
  }
  function onPreferenceChange(event){if(event.matches&&skipShuffle===finish)finish()}
  skipShuffle=finish;
  reduced.addEventListener?.('change',onPreferenceChange);
  animations.at(-1).finished.then(()=>{if(skipShuffle===finish)finish()},()=>{});
}

function animateDraw(board,source,slotArt,cardSize,angle){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate)return;
  const overlay=document.createElement('div');
  overlay.className='draw-magic';
  overlay.setAttribute('aria-hidden','true');
  board.append(overlay);
  const bounds=overlay.getBoundingClientRect(),target=slotArt.getBoundingClientRect();
  const center=rect=>({x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2});
  const start=center(source),end=center(target);
  const lift={x:start.x,y:start.y-Math.min(28,cardSize.h*.16)};
  const dx=end.x-lift.x,dy=end.y-lift.y;
  const control={x:lift.x+dx*.32+(dx<0?-1:1)*Math.min(55,bounds.width*.095),y:lift.y+dy*.12};
  const point=t=>({x:(1-t)**2*lift.x+2*(1-t)*t*control.x+t*t*end.x,y:(1-t)**2*lift.y+2*(1-t)*t*control.y+t*t*end.y});
  const path='M '+lift.x+' '+lift.y+' Q '+control.x+' '+control.y+' '+end.x+' '+end.y;
  overlay.innerHTML='<svg class="draw-ribbon" width="100%" height="100%" fill="none" aria-hidden="true"><path class="ribbon-halo" d="'+path+'" pathLength="1"/><path class="ribbon-core" d="'+path+'" pathLength="1"/></svg><div class="flying-arcana">'+TarotArt.back()+'</div>';
  const card=overlay.querySelector('.flying-arcana');
  card.style.width=cardSize.w+'px';
  card.style.height=cardSize.h+'px';
  const place=(p,scale,turn)=>'translate3d('+(p.x-cardSize.w/2)+'px,'+(p.y-cardSize.h/2)+'px,0) rotate('+turn+'deg) scale('+scale+')';
  const frames=[{offset:0,transform:place(start,1,angle),easing:'ease-out'},
    {offset:.22,transform:place(lift,1.13,-angle*.18),easing:'ease-in-out'},
    {offset:.31,transform:place(lift,1.12,-angle*.18)}];
  const finalScale=target.width/cardSize.w;
  for(let i=1;i<=14;i++){
    const t=i/14,travel=t*t*(3-2*t);
    frames.push({offset:.31+.69*t,transform:place(point(travel),1.12+(finalScale-1.12)*travel,-angle*.18*(1-travel)+7*Math.sin(travel*Math.PI))});
  }
  // Small points of light follow the same curve as the card.
  for(let i=0;i<10;i++){
    const t=(i+.5)/10,p=point(t);
    const spark=document.createElement('i');
    spark.className='draw-spark';
    spark.style.left=p.x+((i%3)-1)*13+'px';
    spark.style.top=p.y+(i%2?8:-9)+'px';
    spark.style.setProperty('--delay',(235+i*48)+'ms');
    spark.style.setProperty('--drift',(i%2?8:-8)+'px');
    overlay.append(spark);
  }
  slotArt.classList.add('receiving');
  const flight=card.animate(frames,{duration:820,fill:'both'});
  return new Promise(resolve=>{
    const settle=()=>{
      slotArt.classList.remove('receiving');
      slotArt.classList.add('landed');
      card.remove();
      resolve();
    };
    flight.onfinish=settle;
    flight.oncancel=settle;
    // A background tab can delay animation events. The cleanup also releases the reading.
    setTimeout(()=>{settle();overlay.remove()},1250);
  });
}
async function selectDrawCard(button,index){
  const positions=spreads[chosenSpread].pos;
  if(view!=='draw'||button.disabled||picks.length>=positions.length||pickedSlots.includes(index))return;
  const board=button.closest('.tabletop'),source=button.getBoundingClientRect();
  const cardSize={w:button.offsetWidth,h:button.offsetHeight};
  const matrix=getComputedStyle(button).transform;
  let angle=(index-4)*4;
  if(matrix!=='none'&&typeof DOMMatrixReadOnly==='function'){
    const rotation=new DOMMatrixReadOnly(matrix);
    angle=Math.atan2(rotation.b,rotation.a)*180/Math.PI;
  }
  const slots=board.querySelectorAll('.slot'),slot=slots[picks.length],slotArt=slot.querySelector('.slot-art');
  pickedSlots.push(index);
  picks.push({id:shuffled[index],rev:reversals&&rand(2)===1});
  button.disabled=true;
  button.classList.add('taken');
  slot.classList.remove('next');
  slot.classList.add('chosen');
  slotArt.innerHTML=TarotArt.back();
  const done=picks.length===positions.length;
  if(done){
    board.querySelectorAll('.drawcard').forEach(card=>card.disabled=true);
    board.querySelector('[data-act=redeal]').disabled=true;
  }else{
    slots[picks.length].classList.add('next');
  }
  main.querySelector('.subhead p').textContent=drawHint(positions,picks.length);
  const landing=animateDraw(board,source,slotArt,cardSize,angle);
  TarotSound.effect('pick');
  announce('已選 '+picks.length+' 張。'+drawHint(positions,picks.length));
  if(!done){
    if(lastKeyboard)focusNextPick();
    return;
  }
  await landing;
  if(!board.isConnected||view!=='draw')return;
  current=makeReading();
  TarotSound.effect('reveal');
  result(true);
  goTop();
  announce(spreads[current.spread].name+'解讀完成。'+current.cards.map(c=>deck[c.id].name+(c.rev?'逆位':'正位')).join('、')+'。');
}
function makeReading(){return {id:Date.now().toString(36)+'-'+rand(10000000).toString(36),at:Date.now(),spread:chosenSpread,q,cards:picks.map(c=>({...c}))}}
function focusNextPick(){const node=main.querySelector('.drawcard:not(:disabled)');if(node)node.focus({preventScroll:true})}
function readingOverview(r,reading){
  const heading=r.spread===0?'這張牌給你的回答':'整組牌給你的回答';
  const angle=reading.angle?'<p class="read-angle">'+esc(reading.angle)+'</p>':'';
  const first=reading.parts[0];
  const story=r.cards.length===1?'你抽到「'+first.cardName+'」'+(first.rev?'逆位':'正位')+'，這張牌的重點是「'+first.keyword+'」。':reading.story;
  const combined='<p class="read-story">'+esc(story)+'</p>';
  return '<section class="read-overview" aria-labelledby="read-title"><div class="section-k"><span class="rule"></span>'+heading+'</div><h2 id="read-title">'+esc(reading.headline)+'</h2>'+angle+combined+
    '<dl class="read-next"><div><dt>先做一件事</dt><dd>'+esc(reading.action)+'</dd></div><div><dt>之後觀察</dt><dd>'+esc(reading.signal)+'</dd></div></dl></section>';
}
function result(animate=false){
  view='result';
  const r=current,s=spreads[r.spread],n=r.cards.length;
  const saved=getJournal().some(x=>x.id===r.id),reading=interpretReading(r);
  const cards=reading.parts.map((entry,i)=>{
    const position=s.pos[i];
    const [noteTitle,note]=positionNote(r,entry,i);
    const artClass=(animate?'reveal ':'')+(entry.rev?'reverse':'');
    return '<article class="reading"><div class="section-k">'+esc(position)+'</div><button class="art face-view '+artClass+'" data-act="card" data-id="'+entry.id+'" data-position="'+i+'" aria-label="放大'+esc(entry.cardName)+'牌面">'+TarotArt.face(entry.id)+'</button><h3>'+esc(entry.cardName)+' <small>'+(entry.rev?'逆位':'正位')+'</small></h3><p><b>'+esc(entry.keyword)+'</b> · '+esc(entry.meaning)+'</p><p class="lens"><b>'+noteTitle+'</b>'+esc(note)+'</p></article>';
  }).join('');
  const actions=btn('save',saved?'已存入手記':'存入占卜手記',saved?'check':'note','gold',saved)+btn('spreads','再占卜一次','cards','ghost');
  const previous=fromJournal?back('回到占卜手記','journal'):back('回到牌陣','spreads');
  const userQuestion=r.q?'<p class="resultq">你的問題　「'+esc(r.q)+'」</p>':'';
  shell(page(previous+title(s.en,s.name+' · 牌面解讀')+steps(2)+userQuestion+
    readingOverview(r,reading)+'<div class="results '+(n===1?'one':'')+'" style="--count:'+n+'">'+cards+'</div><div class="btns">'+actions+'</div>'));
}
function library(){view='library';shell(page(title('THE CARD ARCHIVE','牌義圖鑑','韋特塔羅全套 78 張：22 張大阿爾克那，以及權杖、聖杯、寶劍、錢幣各 14 張。點選卡牌可放大牌面，查看正位和逆位的牌義。')+'<div class="searchrow"><input type="search" id="cardSearch" value="'+esc(search)+'" placeholder="搜尋牌名或關鍵字" aria-label="搜尋牌名或關鍵字"><span id="cardCount" role="status"></span></div><div class="filters" aria-label="牌組篩選">'+['全部','大阿爾克那','權杖','聖杯','寶劍','錢幣'].map((x,i)=>'<button class="chip" aria-pressed="'+(x===filter)+'" data-act="filter" data-id="'+i+'">'+x+'</button>').join('')+'</div><div class="cardgrid" id="cardgrid"></div>'));fillGrid()}
function fillGrid(){const key=search.trim().toLowerCase(),list=deck.filter(c=>(filter==='全部'||c.group===filter)&&[c.name,c.en,c.up,c.down].some(v=>v.toLowerCase().includes(key)));$('#cardCount').textContent=list.length+' 張';$('#cardgrid').innerHTML=list.map(c=>'<button class="cardtile" data-act="card" data-id="'+c.id+'"><span class="art">'+TarotArt.face(c.id,true)+'</span><b>'+c.name+'</b><small lang="en">'+c.en+'</small></button>').join('')||'<p class="hint">沒有符合的牌，試試其他名稱或關鍵字。</p>'}
function journal(){view='journal';const all=getJournal();shell(page(title('THE READING JOURNAL','占卜手記','回看你親手儲存的牌陣。紀錄保存在目前使用的瀏覽器。')+'<div class="journal-list">'+(all.length?all.map(r=>'<article class="journal-item"><button data-act="openreading" data-id="'+esc(r.id)+'"><small>'+new Date(r.at).toLocaleString('zh-TW',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</small><h3>'+spreads[r.spread].name+'</h3><span>'+esc(r.q||r.cards.map(c=>deck[c.id].name).join(' · '))+'</span></button><button class="iconbtn" data-act="delete" data-id="'+esc(r.id)+'" aria-label="刪除這篇紀錄">'+icon('trash')+'</button></article>').join(''):'<div class="box empty">'+icon('note')+'<h3>這裡等著你的第一篇手記</h3><p>占卜後按「存入占卜手記」，就能在這裡重新翻閱。</p>'+btn('spreads','挑選牌陣','cards')+'</div>')+'</div>'))}
function showModal(titleText,body){$('#modalInside').innerHTML='<div class="modalhead"><h2 id="modalTitle">'+esc(titleText)+'</h2><button data-act="close" aria-label="關閉">×</button></div>'+body;if(!modal.open)modal.showModal()}
function showCard(id,position){
  const card=deck[id],inReading=view==='result'&&Number.isInteger(position)&&current?.cards[position]?.id===id;
  const reverse=inReading&&current.cards[position].rev;
  showModal(card.name,'<div class="modalcopy card-inspect"><div class="modal-art art '+(reverse?'reverse':'')+'">'+TarotArt.face(id)+'</div><div><div class="section-k">'+esc(card.en)+'</div><h3>正位 · '+esc(card.up)+'</h3><p>'+esc(card.upright)+'</p><h3>逆位 · '+esc(card.down)+'</h3><p>'+esc(card.reversed)+'</p></div></div>');
}
function guide(){showModal('使用指南','<div class="modalcopy"><h3>① 直接抽牌或選牌陣</h3><p>點「抽今日一牌」就能入座，也可以在首頁選「時間之流」或「關係之鏡」抽三張。想針對一個問題占卜，可在抽牌前點「調整問題」。</p><h3>② 選滿後自動解牌</h3><p>每次洗牌都會打亂全部 78 張牌。選滿最後一張後，系統會自動翻牌，依抽中的牌、正逆位及所在位置，顯示整體解讀與具體建議。</p><h3>③ 聆聽與記錄</h3><p>點右上角開啟原創配樂，旁邊的選單可調音量。解讀後可將牌陣存入這個瀏覽器的手記。</p><h3>④ 測姓名或做配對</h3><p>從上方選單進入「八字姓名學」或「姓名配對」。填入姓名、國曆出生年月日、當地時間與時區即可排四柱。配對會顯示契合程度與分項依據，也可選只用姓名簡測。資料只在本頁計算。</p><p>塔羅可作為自我探索的提問工具。牌面提供的是思考角度，選擇仍由你做出。</p><p class="art-credit">經典韋特塔羅（Rider–Waite–Smith）由 Pamela Colman Smith 繪製、Arthur Edward Waite 構思，1909 年首版。本站採用 Steve P. 修復的 Pam-A 版掃描。<a href="https://steve-p.org/cards/RWSa.html" target="_blank" rel="noopener noreferrer">查看牌圖來源</a></p></div>')}
function goSpreads(){home();const h=$('#spreadTitle');h.focus({preventScroll:true});$('#spreads').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
function audioUi(){const on=TarotSound.isPlaying();$('#audioToggle').setAttribute('aria-pressed',String(on));$('#audioText').textContent=on?'音樂播放中':'開啟音樂'}
async function toggleMusic(){if(busyMusic)return;busyMusic=true;try{if(TarotSound.isPlaying()){TarotSound.stop()}else{TarotSound.setVolume(volume);const ok=await TarotSound.start();if(!ok)notify('這個瀏覽器目前無法播放音樂。')}}catch{notify('音樂暫時無法播放，可再次點選重試。')}finally{busyMusic=false;audioUi()}}
function closeVolume(){$('#volumePanel').hidden=true;document.querySelector('.volumeBtn').setAttribute('aria-expanded','false')}
let lastKeyboard=false;
document.addEventListener('keydown',e=>{lastKeyboard=true;if(e.key==='Escape')closeVolume()});document.addEventListener('pointerdown',()=>lastKeyboard=false);
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-act]');if(!e.target.closest('.soundctrl'))closeVolume();if(e.target===modal){const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)modal.close()}if(!button||button.disabled)return;
 const act=button.dataset.act,id=button.dataset.id,i=Number(id);
 switch(act){
 case 'home':home();goTop();break;
 case 'name-test':case 'name-match':if(location.hash!=='#'+act)history.pushState(null,'','#'+act);showNamePage(act);goTop();break;
 case 'spreads':goSpreads();break;
 case 'start':case 'spread':chosenSpread=act==='start'?0:i;q='';shuffleDeck();draw();goTop();break;
 case 'setup':setup();goTop();break;
 case 'example':q=spreads[chosenSpread].examples[i];$('#q').value=q;$('#q').focus();break;
 case 'shuffle':q=$('#q').value.trim();reversals=$('#reversals').checked;shuffleDeck();draw();goTop();break;
 case 'redeal':shuffleDeck();draw(true);break;
 case 'skipshuffle':skipShuffle?.();break;
 case 'pick':selectDrawCard(button,i);break;
 case 'save':if(view!=='result'||!current)break;{const all=getJournal();if(!all.some(r=>r.id===current.id)&&writeJournal([current,...all])){TarotSound.effect('save');result();notify('這次占卜已存入手記。')}}break;
 case 'library':filter='全部';search='';library();goTop();break;
 case 'filter':filter=['全部','大阿爾克那','權杖','聖杯','寶劍','錢幣'][i];document.querySelectorAll('[data-act=filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fillGrid();break;
 case 'card':showCard(i,Number(button.dataset.position));break;
 case 'journal':journal();goTop();break;
 case 'openreading':{const found=getJournal().find(r=>r.id===id);if(found){current=found;fromJournal=true;result();goTop()}}break;
 case 'delete':showModal('刪除這篇手記？','<div class="modalcopy"><p>刪除後將無法恢復這次的牌陣紀錄。</p></div><div class="btns" style="margin-top:17px"><button class="btn ghost" data-act="close">保留手記</button><button class="btn gold" data-act="confirmdelete" data-id="'+esc(id)+'">刪除手記</button></div>');break;
 case 'confirmdelete':if(writeJournal(getJournal().filter(r=>r.id!==id))){modal.close();journal();notify('手記已刪除。')}break;
 case 'close':modal.close();break;case 'guide':guide();break;case 'music':toggleMusic();break;
 case 'volume':{const panel=$('#volumePanel');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)$('#vol').focus()}break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='cardSearch'){search=e.target.value;fillGrid()}else if(e.target.id==='vol'){volume=Number(e.target.value)/100;TarotSound.setVolume(volume);$('#volValue').textContent=e.target.value+'%';try{localStorage.setItem(volumeKey,String(volume))}catch{}}else if(e.target.id==='q'){q=e.target.value}});
$('#vol').value=String(Math.round(volume*100));$('#volValue').textContent=$('#vol').value+'%';TarotSound.setVolume(volume);
function openLocation(){
 const route=location.hash.slice(1);
 if(route==='name-test'||route==='name-match')showNamePage(route);
 else home();
}
window.addEventListener('popstate',()=>{openLocation();goTop()});
openLocation();
