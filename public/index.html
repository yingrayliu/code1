<header><div class="frame mast"><a href="#chart" class="brand" aria-label="星序首頁"><span class="brandmark" aria-hidden="true">✧</span><strong>星序</strong><span class="brand-en">ASTRAL ATLAS</span></a><nav aria-label="主選單"><button data-page="chart" class="navtab">個人命盤</button><button data-page="daily" class="navtab">每日運勢</button></nav><button id="archive" class="pill quiet"><span aria-hidden="true">▤</span> 已存命盤</button></div></header>
<main class="frame">
<section id="chartPage"><div class="intro"><div><p class="eyebrow">Natal chart</p><h1>我的星盤</h1><p class="meta" id="birthmeta"></p></div><div class="actions"><button id="edit" class="pill quiet">調整出生資料</button><button id="save" class="pill solid">儲存命盤</button></div></div>
<div class="hero"><section class="wheelcard" aria-labelledby="wheelTitle"><div class="wheelbar"><h2 id="wheelTitle">本命星盤</h2><label class="switch"><input type="checkbox" id="aspectToggle" checked><span></span>相位線</label></div><div id="wheel"></div><p class="wheelhint" id="wheelhint"></p></section>
<section class="detail" aria-label="選取的星體解讀" aria-live="polite"><div class="detailhero"><div class="globe" id="globe" aria-hidden="true"></div><div class="identity"><p class="eyebrow" id="planetEn"></p><h2 id="planetName" tabindex="-1"></h2></div></div><div class="readouts" id="readouts"></div><div class="reading"><h3 id="placementTitle">落點解讀</h3><p id="reading"></p><p id="houseReading"></p><div class="guide-links" id="bodyGuideLinks"></div></div><div class="pager"><button id="prev" aria-label="上一個星體">‹</button><span id="counter"></span><button id="next" aria-label="下一個星體">›</button></div></section></div>
<div class="tabs" id="tabs" aria-label="星盤資料"><button data-tab="positions">星體落點</button><button data-tab="signs">十二星座</button><button data-tab="aspects">主要相位</button><button data-tab="about">排盤說明</button></div><section id="lower"></section></section>
<section id="dailyPage" hidden><div class="intro"><div><p class="eyebrow">Daily horoscope</p><h1>每日運勢</h1><p class="meta" id="dayStamp"></p></div><div class="actions"><select id="sunSign" aria-label="選擇太陽星座"></select><button id="rememberSign" class="pill quiet">記住星座</button></div></div>
<div class="daynav" id="daynav"><button data-offset="-1">昨天</button><button data-offset="0">今天</button><button data-offset="1">明天</button></div><div id="dayContent"></div></section>
</main><footer class="frame"><span>✧　星序</span><span>西洋占星・繁體中文</span></footer>
<dialog id="sheet"><form id="editForm"><div class="dialogtitle"><h2>出生資料</h2><button type="button" class="close" aria-label="關閉">×</button></div><label>出生日期<input id="birthDate" type="date" required min="1901-01-01"></label><label>出生時間<input id="birthTime" type="time" required></label><label class="check"><input type="checkbox" id="unknown"> 不知道出生時間</label><label>出生縣市<select id="city"></select></label><p class="note">以台灣各縣市代表座標與出生當地時間計算。選擇時間未知可查看當天可確定的星體落點。</p><p id="error" role="alert"></p><button class="pill solid wide" type="submit">產生我的命盤</button></form></dialog>
<dialog id="signGuide" aria-labelledby="guideName">
 <div class="dialogtitle guide-toolbar"><select aria-label="切換解讀星座" id="guidePick"></select><button type="button" class="close" aria-label="關閉星座解讀">×</button></div>
 <div class="guide-heading"><span id="guideGlyph" aria-hidden="true"></span><div><p id="guideMeta"></p><h2 id="guideName"></h2></div></div>
 <section class="guide-copy"><h3 id="guideTitle"></h3><p id="guideText"></p></section>
 <section class="guide-chart"><h3>這張命盤的落點</h3><div id="guideBodies"></div></section><div id="guideSourcesHost"></div></dialog>

</script><script>const $=id=>document.getElementById(id);

try{let items=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(items))stored=items.filter(i=>{try{return validInput(i)}catch{return false}});const s=localStorage.getItem(prefKey);if(s!==null&&/^([0-9]|1[01])$/.test(s))preferred=Number(s);}catch{}

function svgWheel(){
 const {cusps,bodies,input}=chart,anchor=cusps?cusps[0]:0,cen=215;
 const p=(lon,r)=>{let a=(lon-anchor)*rad;return [cen-r*Math.cos(a),cen+r*Math.sin(a)]};
 const point=(lon,r)=>p(lon,r).map(n=>n.toFixed(2)).join(' ');
 function line(a,b,c,d,style){let [x,y]=p(a,b),[xx,yy]=p(c,d);return '<line x1="'+x+'" y1="'+y+'" x2="'+xx+'" y2="'+yy+'" '+style+'/>'}
 const circle=(r,style)=>'<circle cx="215" cy="215" r="'+r+'" '+style+'/>';
 const label=(lon,r,t,s)=>'<text x="'+p(lon,r)[0]+'" y="'+p(lon,r)[1]+'" dominant-baseline="central" text-anchor="middle" '+s+'>'+t+'</text>';
 const stroke=(color,w=1)=>'stroke="'+color+'" stroke-width="'+w+'"';
 let out='<svg viewBox="0 0 430 430" aria-label="互動本命星盤"><g fill="none">';
 for(const [r,color,w] of [[195,'#55736b',.65],[189,'#c3b67e',1.2],[164,'#9c9d77',.8],[155,'#7c9281',.9],[115,'#8f9d87',.6],[93,'#5d8079',.7]])out+=circle(r,stroke(color,w));out+='</g>';
 for(let d=0;d<360;d+=2)out+=line(d,155,d,d%10===0?163:d%6===0?160:158,stroke(d%10===0?'#c2b98b':'#748e81',.85));
 for(let s=0;s<12;s++){
  const start=s*30,end=start+30;
  const path='M '+point(start,163)+' L '+point(start,193)+' A 193 193 0 0 0 '+point(end,193)+' L '+point(end,163)+' A 163 163 0 0 1 '+point(start,163)+' Z';
  out+='<g class="sign-sector" role="button" tabindex="0" data-guide="'+s+'" aria-label="閱讀'+signs[s]+'座解讀" aria-haspopup="dialog"><title>'+signs[s]+'座・星座解讀</title><path d="'+path+'"/>'+line(start,164,start,189,stroke('#a59d76',.8))+label(start+15,176,zodiac[s],'fill="#ede3b8" font-family="DejaVu Sans,serif" font-size="17"')+'</g>';
 }
 if(cusps){cusps.forEach((lon,i)=>{const k=i%3===0;out+=line(lon,94,lon,154,stroke(k?'#bbad78':'#587972',k?1.25:.7));out+=label(lon+norm(cusps[(i+1)%12]-lon)/2,104,i+1,'fill="#b6c5ae" font-size="9" font-family="Arial"');});out+=label(cusps[0],205,'AC','fill="#efe2ae" font-size="10" font-family="Arial"');out+=label(cusps[9],204,'MC','fill="#efe2ae" font-size="10" font-family="Arial"');}
 if($('aspectToggle').checked&&cusps){for(const a of chart.aspects){const active=a.a===selected||a.b===selected;out+=line(bodies[a.a].lon,93,bodies[a.b].lon,93,stroke(a.degree===90||a.degree===180?'#dc9b7c':'#8dc2b5',active?1.6:.85)+' opacity="'+(active?.96:.46)+'"');}}
 out+=circle(3,'fill="#d0bf8d"');
 // Place nearby glyphs apart while keeping a leader at each exact longitude.
 const sorted=bodies.map((b,i)=>({lon:b.lon,i})).sort((a,b)=>a.lon-b.lon);
 let gap=0,biggest=-1;sorted.forEach((b,i)=>{let width=norm(sorted[(i+1)%sorted.length].lon-b.lon);if(width>biggest){biggest=width;gap=(i+1)%sorted.length}});
 const order=sorted.slice(gap).concat(sorted.slice(0,gap));let prior=-999;
 const spaced=order.map(item=>{const actual=norm(item.lon-order[0].lon);const at=Math.max(actual,prior+15);prior=at;return {i:item.i,actual,at};});
 for(let start=0;start<spaced.length;){let end=start;while(end+1<spaced.length&&spaced[end+1].at>spaced[end+1].actual+.001)end++;const shift=(spaced[end].at-spaced[end].actual)/2;for(let j=start;j<=end;j++)spaced[j].at-=shift;start=end+1;}
 for(const v of spaced){const b=bodies[v.i],sel=v.i===selected,L=v.at+order[0].lon,[x,y]=p(L,135);out+=line(b.lon,155,L,139,stroke(sel?'#f3df9a':'#91aaa0',1));out+=line(b.lon,93,b.lon,98,stroke('#b3bca0',1));out+='<g class="hit" role="button" tabindex="0" data-planet="'+v.i+'" aria-label="'+b.name+'，'+posSign(b)+'" aria-pressed="'+sel+'"><title>'+b.name+'・'+posSign(b)+'</title><circle cx="'+x+'" cy="'+y+'" r="15" fill="transparent"/><circle class="disc" cx="'+x+'" cy="'+y+'" r="'+(sel?12:10)+'" fill="'+(sel?'#e7d49b':'#174447')+'" stroke="'+(sel?'#f4e4ac':'#77958c')+'"/><text x="'+x+'" y="'+y+'" dominant-baseline="central" text-anchor="middle" fill="'+(sel?'#183c3c':'#e3e8d6')+'" font-size="'+(v.i===10?10:16)+'" font-family="DejaVu Sans,Georgia,serif">'+b.glyph+'</text></g>';}
 $('wheel').innerHTML=out+'</svg>';
 $('wheelhint').textContent=input.unknown?'外圈可讀十二星座・星體以當地中午位置示意':'點外圈讀十二星座，點內圈看星體落點';
}

function renderDaily(){
 const sign=+$('sunSign').value,now=todayTaipei(),instant=new Date(Date.parse(now+'T12:00:00+08:00')+dayOffset*86400000);
 const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(instant),pretty=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(instant);

 const msgs=['當日月亮位於以太陽星座起算的'+housesLabel(mansion+1)+'，可以把注意力放在「'+houseNames[mansion]+'」。',editorial[sh[1]][1],editorial[sh[2]][2],editorial[sh[3]][3]];

 $('dayContent').innerHTML='<div class="dayhero"><div><p class="eyebrow">'+signs[sign]+'座・每日短評</p><h2>'+phrase+'</h2></div><span class="bigsymbol">'+zodiac[sign]+'</span></div><div class="tiles">'+domains.map((n,j)=>'<article class="tile"><h3>'+n+'<span class="stars" aria-label="'+starCount[j]+' 顆星，共五顆">'+('★'.repeat(starCount[j])+'☆'.repeat(5-starCount[j]))+'</span></h3><p>'+msgs[j]+'</p></article>').join('')+'</div><div class="lucky">'+lucky.map(([k,v])=>'<div><small>'+k+'</small><b>'+v+'</b></div>').join('')+'</div><p class="note">本站以台北時間中午的星體位置編排太陽星座運勢，星等與幸運提示為娛樂性占星解讀。</p>';
}

function renderGuide(index) {
  const name=signs[index]+'座', note=signNotes[index];
  $('guidePick').value=index;
  $('guideName').textContent=name;
  $('guideGlyph').textContent=zodiac[index];
  $('guideMeta').textContent=signMeta(index);
  $('guideTitle').textContent=note.title;
  $('guideText').textContent=note.text;
  const placements=chart.bodies.map((body,i)=>({body,i})).filter(({body})=>candidateSigns(body).includes(index));
  if(!placements.length){
    $('guideBodies').innerHTML='<p>這張盤列出的星體與上升點在此沒有落點。仍可從上方認識'+name+'的象徵。</p>';
  }else{
    $('guideBodies').innerHTML=placements.map(({body,i})=>{
      const uncertain=candidateSigns(body).length>1;
      const suffix=uncertain?'（可能落入，待確認時間）':body.house?'・'+housesLabel(body.house):'（宮位待確認）';
      return '<article><h4>'+body.name+suffix+'</h4><p>'+placementNotes[body.id][index]+'</p><button class="textlink" data-jump-body="'+i+'">在星盤查看'+body.name+'</button></article>';
    }).join('');

}
